name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: publish (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build client bundle
        run: npm run build

      - name: Bundle freshness check
        run: git diff --exit-code -- packages/mailbox/lib/client.js || (echo "lib/client.js 与源码不同步, 请本地 npm run build 后重新打 tag" && exit 1)

      - name: Publish to npm
        working-directory: packages/mailbox
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
