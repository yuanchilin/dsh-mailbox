name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build client bundle
        run: npm run build

      - name: Bundle freshness check
        run: git diff --exit-code -- packages/mailbox/lib/client.js || (echo "lib/client.js 与源码不同步, 请本地运行 npm run build 后提交" && exit 1)
